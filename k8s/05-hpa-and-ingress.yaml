apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: electronix-app-hpa
  namespace: electronix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: electronix-app-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: electronix-ingress
  namespace: electronix
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Afinidad de sesión para soporte consistente de WebSockets/SockJS (CONC-01)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
spec:
  tls:
    - hosts:
        - electronix.tudominio.com
      secretName: electronix-tls-cert
  rules:
    - host: electronix.tudominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: electronix-app-service
                port:
                  number: 80
