apiVersion: v1
kind: ServiceAccount
metadata:
  name: electronix-app-sa
  namespace: electronix
  # En GKE con Workload Identity, descomenta la anotación y cambia automountServiceAccountToken a true:
  # annotations:
  #   iam.gke.io/gcp-service-account: "electronix-backend-sa@TU_PROJECT_ID.iam.gserviceaccount.com"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: electronix-app-deployment
  namespace: electronix
  labels:
    app: electronix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: electronix-app
  template:
    metadata:
      labels:
        app: electronix-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: electronix-app-sa
      # Planificación (Semana 12): distribuye réplicas entre distintos nodos para alta disponibilidad
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["electronix-app"]
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: electronix-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: electronix-app
          # En clúster cloud (GKE/EKS) reemplaza por tag/digest inmutable de Artifact Registry
          image: us-central1-docker.pkg.dev/PROJECT_ID/electronix/app:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: SPRING_PROFILES_ACTIVE
            - name: DEMO_SEED_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: DEMO_SEED_ENABLED
            - name: APP_STORAGE_TYPE
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: APP_STORAGE_TYPE
            - name: GCP_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: GCP_STORAGE_BUCKET
            - name: APP_UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: APP_UPLOAD_DIR
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: CORS_ORIGINS
            - name: GEMINI_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: GEMINI_ENABLED
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: GEMINI_MODEL
            - name: GEMINI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: GEMINI_BASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: electronix-app-secret
                  key: GEMINI_API_KEY
                  optional: true
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: electronix-db-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: electronix-app-secret
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: electronix-app-secret
                  key: ADMIN_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: electronix-config
                  key: SPRING_DATA_REDIS_PORT
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: electronix-redis-secret
                  key: REDIS_PASSWORD
            - name: PROMETHEUS_SCRAPE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: electronix-monitoring-secret
                  key: PROMETHEUS_SCRAPE_TOKEN
            # Descomentar junto con volumes/volumeMounts si el clúster no usa GKE Workload Identity:
            # - name: GCP_CREDENTIALS_PATH
            #   value: "/var/secrets/google/gcp-sa-key.json"
          # volumeMounts:
          #   - name: gcp-sa-key
          #     mountPath: /var/secrets/google
          #     readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      # volumes:
      #   - name: gcp-sa-key
      #     secret:
      #       secretName: electronix-app-secret
      #       defaultMode: 0400
      #       items:
      #         - key: gcp-sa-key.json
      #           path: gcp-sa-key.json
---
apiVersion: v1
kind: Service
metadata:
  name: electronix-app-service
  namespace: electronix
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: electronix-app
