apiVersion: v1
kind: ConfigMap
metadata:
  name: electronix-config
  namespace: electronix
data:
  SPRING_PROFILES_ACTIVE: "prod"
  POSTGRES_DB: "ecommerce_db"
  POSTGRES_USER: "ecommerce_user"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/ecommerce_db"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"
  DEMO_SEED_ENABLED: "false"
  APP_STORAGE_TYPE: "gcs"
  GCP_STORAGE_BUCKET: "electronix-uploads-utp-cloud-electronix-2026"
  APP_UPLOAD_DIR: "/app/uploads"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  CORS_ORIGINS: "https://electronix.tudominio.com"
  GEMINI_ENABLED: "true"
  GEMINI_MODEL: "gemini-3.1-flash-lite"
  GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta"
