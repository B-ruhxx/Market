apiVersion: v1
kind: ConfigMap
metadata:
  name: electronix-config
  namespace: electronix
data:
  SPRING_PROFILES_ACTIVE: "prod"
  POSTGRES_DB: "ecommerce_db"
  POSTGRES_USER: "postgres"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/ecommerce_db"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  APP_UPLOAD_DIR: "/app/uploads"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  CORS_ORIGINS: "http://localhost:8080,http://localhost:8090,https://electronix.tudominio.com"
