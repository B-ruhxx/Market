spring:
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized
      roles: CONFIGURACION_GESTIONAR
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

app:
  auth:
    distributed-rate-limit: false
  demo-seed:
    enabled: false
  upload-dir: ${java.io.tmpdir}/electronix-test-uploads
  storage:
    type: local
  ia:
    gemini:
      enabled: false
      api-key: ""

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 3600000
