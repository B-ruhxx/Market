<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <title>Mis pedidos — ELECTRONIX</title>
    <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/output.css">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css">
    <link rel="stylesheet" href="/assets/css/pages/figma-home.css?v=4">
    <link rel="stylesheet" href="/assets/css/storefront.css?v=4">
    <link rel="stylesheet" href="/assets/css/pages/purchase-flow.css?v=1">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js" defer></script>
</head>
<body class="storefront-flow">
    <a class="store-skip-link" href="#pedidos">Saltar a mis pedidos</a>
    <header id="main-navbar" class="store-header"><div class="fx-topbar"><a href="/index.html" class="fx-brand"><img src="/assets/img/logo.svg" alt="Electronix" class="fx-brand-logo"><span>ELECTRONIX</span></a></div></header>
    <main id="pedidos" class="store-container flow-main">
        <nav class="flow-breadcrumb" aria-label="Ruta de navegación"><a href="/index.html">Inicio</a><span aria-hidden="true">/</span><span aria-current="page">Mis pedidos</span></nav>
        <header class="flow-heading"><div><p class="store-eyebrow">Cada paso de tu compra</p><h1>Tu pedido, más cerca.</h1><p>Consulta tus compras y el estado registrado por la tienda.</p></div><a href="/informacion.html#chat" class="store-text-link">¿Necesitas ayuda?</a></header>
        <div class="flow-orders-toolbar">
            <label for="orders-filter">Mostrar <select id="orders-filter"><option value="todos">Todos los pedidos</option><option value="activos">En curso</option><option value="entregados">Entregados</option><option value="cancelados">Cancelados</option></select></label>
            <button type="button" id="orders-refresh" class="flow-link">Actualizar pedidos</button>
        </div>
        <p id="orders-feedback" class="flow-message" role="status" aria-live="polite"></p>
        <p id="orders-updated" class="flow-updated" role="status"></p>
        <div id="orders-container" aria-busy="true"><div class="flow-state" role="status"><p>Estamos buscando tus pedidos…</p></div></div>
        <noscript><p class="flow-message">Activa JavaScript para consultar los pedidos de tu cuenta.</p></noscript>
    </main>
    <footer data-site-footer></footer>
    <script type="module" src="/assets/js/pages/mis-pedidos.js?v=2"></script>
</body>
</html>
