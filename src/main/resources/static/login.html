<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <title>Tu cuenta — ELECTRONIX</title>
    <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/output.css">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css">
    <link rel="stylesheet" href="/assets/css/pages/figma-home.css?v=4">
    <link rel="stylesheet" href="/assets/css/storefront.css?v=4">
    <link rel="stylesheet" href="/assets/css/pages/purchase-flow.css?v=1">
</head>
<body class="storefront-flow flow-login">
    <a class="store-skip-link" href="#acceso">Saltar al inicio de sesión</a>
    <header id="main-navbar" class="store-header"><div class="fx-topbar"><a href="/index.html" class="fx-brand"><img src="/assets/img/logo.svg" alt="Electronix" class="fx-brand-logo"><span>ELECTRONIX</span></a></div></header>
    <main id="acceso" class="auth-main">
        <div class="auth-content">
            <p class="store-eyebrow">Tu cuenta Electronix</p>
            <h1>Qué bueno<br>tenerte de vuelta.</h1>
            <p class="auth-intro">Inicia sesión para continuar con tu compra y consultar tus pedidos.</p>
            <form id="login-form" class="auth-form" method="post" autocomplete="off">
                <div class="flow-field">
                    <label for="login-email">Correo electrónico</label>
                    <input id="login-email" name="email" type="email" placeholder="ejemplo@correo.com" required autocomplete="off" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" maxlength="254">
                </div>
                <div class="flow-field">
                    <label for="login-password">Contraseña</label>
                    <div class="auth-password">
                        <input id="login-password" name="password" type="password" placeholder="Tu contraseña" required autocomplete="new-password" data-lpignore="true" data-1p-ignore="true" data-bwignore="true">
                        <button type="button" id="login-password-toggle" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
                            <svg id="login-password-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.25 12s3.5-6 9.75-6 9.75 6 9.75 6-3.5 6-9.75 6-9.75-6-9.75-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                        </button>
                    </div>
                </div>
                <label class="auth-remember" for="login-remember"><input id="login-remember" type="checkbox" checked>Recordar sesión</label>
                <p id="login-error" class="flow-message" data-tone="error" role="alert" hidden></p>
                <button type="submit" id="btn-submit-login" class="store-button" disabled>Iniciar sesión</button>
            </form>
            <p class="auth-signup">¿Es tu primera visita? <a href="/registro.html">Crear una cuenta</a></p>
            <noscript><p class="flow-message">Activa JavaScript para iniciar sesión de forma segura.</p></noscript>
        </div>
    </main>
    <footer data-site-footer></footer>
    <script type="module" src="/assets/js/pages/login.js?v=2"></script>
</body>
</html>
