<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Clientes — ELECTRONIX Admin</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="stylesheet" href="/assets/css/output.css">
    <script src="/assets/js/admin-theme.js"></script>
    <link rel="stylesheet" href="/assets/css/admin.css?v=4">
    <!-- Librerías locales WebSocket STOMP (sin CDN externo) -->
    <script src="/assets/js/vendor/sockjs.min.js" defer></script>
    <script src="/assets/js/vendor/stomp.min.js" defer></script>
    <link rel="stylesheet" href="/assets/css/admin/chat.css?v=4">
    <link rel="stylesheet" href="/assets/css/ui/ui-inline.css?v=2">
</head>
<body class="adm">

    <header id="main-navbar"></header>

    <main class="adm-main adm-chat-page">

        <div class="adm-pagehead">
            <div>
                <h1 class="adm-title">Chat con Clientes</h1>
                <p class="adm-subtitle">Atención híbrida con Asistente IA y traspaso en tiempo real vía WebSocket STOMP</p>
            </div>
        </div>

        <div class="adm-card adm-chat">

            <aside class="adm-chat-side" aria-label="Lista de conversaciones">
                <div class="adm-chat-side-head">
                    <span>Conversaciones</span>
                    <button id="btn-refrescar-convs" type="button" class="adm-refresh" aria-label="Refrescar lista de conversaciones" title="Refrescar lista">
                        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
                <div id="conversaciones-lista" class="adm-convs">
                    <div class="adm-msg-placeholder">Cargando conversaciones…</div>
                </div>
            </aside>

            <section class="adm-chat-main" aria-label="Sesión de chat">
                <div class="adm-chat-head">
                    <span class="adm-avatar" id="chat-cliente-avatar" aria-hidden="true">?</span>
                    <div class="adm-chat-head-info">
                        <h3 id="chat-cliente-nombre">Selecciona una conversación</h3>
                        <p id="chat-cliente-estado">Canal en espera</p>
                    </div>
                    <div id="chat-head-actions" class="adm-chat-head-actions" hidden>
                        <span id="chat-modo-badge" class="adm-modo-badge">Asistente IA</span>
                        <button id="btn-tomar-chat" type="button" class="adm-btn adm-btn-primary adm-btn-sm">
                            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span>Tomar control</span>
                        </button>
                        <button id="btn-devolver-bot" type="button" class="adm-btn adm-btn-secondary adm-btn-sm">
                            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            <span>Devolver a IA</span>
                        </button>
                    </div>
                </div>

                <div id="admin-chat-messages" class="adm-msgs" aria-live="polite" aria-relevant="additions">
                    <div class="adm-msg-placeholder">Selecciona un cliente de la lista para abrir la sesión de chat.</div>
                </div>

                <div class="adm-chat-foot">
                    <form id="admin-chat-form" class="adm-chat-form">
                        <label class="adm-visually-hidden" for="admin-chat-input">Respuesta para el cliente</label>
                        <input id="admin-chat-input" type="text" placeholder="Escribe una respuesta para el cliente…" disabled
                               class="adm-input" autocomplete="off" maxlength="1000" />
                        <button type="submit" id="admin-chat-send" disabled class="adm-btn adm-btn-primary">
                            Enviar
                        </button>
                    </form>
                </div>
            </section>

        </div>

    </main>

    <script type="module" src="/assets/js/admin/chat.js?v=4"></script>
</body>
</html>
