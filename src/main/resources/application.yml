spring:
  application:
    name: ecommerce
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          must-revalidate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 2000ms
      repositories:
        enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2[0-9]\.\d{1,3}\.\d{1,3}|172\.3[0-1]\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: CONFIGURACION_GESTIONAR
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    # Redis es un caché opcional con degradación elegante hacia PostgreSQL:
    # si Redis cae, la app debe seguir UP y sirviendo tráfico.
    redis:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION:86400000} # 24h en ms

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:8090}
  auth:
    distributed-rate-limit: ${AUTH_DISTRIBUTED_RATE_LIMIT:true}
  monitoring:
    prometheus-scrape-token: ${PROMETHEUS_SCRAPE_TOKEN:}
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:true}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    gcs:
      bucket: ${GCP_STORAGE_BUCKET:}
      public-base-url: ${GCP_STORAGE_PUBLIC_URL:https://storage.googleapis.com}
      include-bucket-in-public-url: ${GCP_STORAGE_INCLUDE_BUCKET_IN_URL:true}
      credentials-path: ${GCP_CREDENTIALS_PATH:}
  ia:
    gemini:
      enabled: ${GEMINI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      temperatura: ${GEMINI_TEMPERATURA:0.3}
      max-historial: ${GEMINI_MAX_HISTORIAL:12}

---
# Perfil Desarrollo (dev)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5435/ecommerce}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:ecommerce_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false # V1 editado sin comentarios
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:8090,https://*.trycloudflare.com,https://*.loca.lt}

---
# Perfil Produccion (prod)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false # V1 fue editado (sin comentarios); checksum no coincide, migración ya aplicada
app:
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:${APP_CORS_ALLOWED_ORIGINS:}}
