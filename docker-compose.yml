services:
  ecommerce-postgres:
    image: postgres:16-alpine
    container_name: electronix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "5435:5432"
    volumes:
      - electronix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  ecommerce-redis:
    image: redis:7-alpine
    container_name: electronix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - electronix_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  ecommerce-app:
    image: electronix-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electronix-app
    restart: unless-stopped
    depends_on:
      ecommerce-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://ecommerce-postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-Admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CLIENTE_PASSWORD: ${CLIENTE_PASSWORD:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # Sirve HTML, CSS, JS e imágenes desde el directorio local montado.
      # Guarda el archivo y actualiza el navegador (Ctrl+F5) para ver los cambios.
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/static/,classpath:/static/
      SPRING_WEB_RESOURCES_CACHE_PERIOD: "0"
      APP_UPLOAD_DIR: /app/uploads
      SPRING_DATA_REDIS_HOST: ecommerce-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,http://localhost:8090,https://*.trycloudflare.com,https://*.loca.lt}
    volumes:
      - electronix_uploads:/app/uploads
      - ./src/main/resources/static:/app/static:ro
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  ecommerce-adminer:
    image: adminer:latest
    container_name: electronix-adminer
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      - ecommerce-postgres

volumes:
  electronix_postgres_data:
  electronix_uploads:
  electronix_redis_data:
