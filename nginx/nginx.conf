events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # DNS interno de Docker para balancear dinamicamente replicas escaladas de ecommerce-app
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compresión Gzip para optimizar transferencia
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Redes internas confiables (Docker bridge / Loopback) para preservar IP real cuando Caddy está delante
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    geo $realip_remote_addr $es_proxy_interno {
        default        0;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        127.0.0.0/8    1;
    }

    map "$es_proxy_interno:$http_x_forwarded_proto" $proto_efectivo {
        "1:https" "https";
        default   $scheme;
    }

    # Mapeo condicional para upgrade de WebSockets (LOW-01)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # Cabeceras defensivas de seguridad HTTP
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Bloquear acceso externo directo a métricas y Prometheus (solo red interna Docker/VPC)
        location ~* ^/actuator/(prometheus|metrics)(/|$) {
            return 403;
        }

        # Proxy hacia el Backend de Spring Boot
        location / {
            set $app_upstream "ecommerce-app:8080";
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;

            # Cabeceras para WebSockets (STOMP) condicionales
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Cabeceras de cliente real normalizadas (evita spoofing de Forwarded/X-Forwarded-For)
            proxy_set_header Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proto_efectivo;

            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Cache de archivos estáticos subidos
        location /uploads/ {
            set $app_upstream "ecommerce-app:8080";
            proxy_pass http://$app_upstream;
            proxy_set_header Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proto_efectivo;
            expires 7d;
            add_header Cache-Control "public, no-transform" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
