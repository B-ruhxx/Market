global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "electronix-app"
    metrics_path: "/actuator/prometheus"
    authorization:
      type: "Bearer"
      credentials_file: "/tmp/scrape_token"
    dns_sd_configs:
      - names:
          - "ecommerce-app"
        type: "A"
        port: 8080
        refresh_interval: 15s
